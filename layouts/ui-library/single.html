{{ partial "header.html" . }}


<div class="content ui-library use-subgrid">
  <div class="ui-library__header">
    <h1 class="type-headline-1">{{ .Title }}</h1>
    <p class="type-body-large">{{ .Description }}</p>
  </div>

  <div
    class="ui-library__tabs"
    data-js="tabs"
    data-ui-library-tabs
    data-tabs-storage-key="ui-library-active-tab"
  >
    <!-- Tab Navigation -->
    <nav class="tabs-nav" role="tablist">
      <button
        type="button"
        id="tab-tokens"
        class="tab-button is-active"
        data-tab="tokens"
        role="tab"
        aria-selected="true"
        aria-controls="panel-tokens"
      >
        {{ i18n "uilib_tokens" }}
      </button>
      <button
        type="button"
        id="tab-grid"
        class="tab-button"
        data-tab="grid"
        role="tab"
        aria-selected="false"
        aria-controls="panel-grid"
      >
        {{ i18n "uilib_grid" }}
      </button>
      <button
        type="button"
        id="tab-components"
        class="tab-button"
        data-tab="components"
        role="tab"
        aria-selected="false"
        aria-controls="panel-components"
      >
        {{ i18n "uilib_components" }}
      </button>
    </nav>

    <!-- Tab Panels -->
    <div class="tabs-content">
      {{ partial "ui-library/tab-tokens.html" . }}

      {{ partial "ui-library/tab-grid.html" . }}

      {{ partial "ui-library/tab-components.html" . }}
    </div>
  </div>

  {{ partial "footer.html" . }}
</div>

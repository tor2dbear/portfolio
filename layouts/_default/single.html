{{ partial "header.html" . }}


<div class="content page use-subgrid">
  <h1 class="type-headline-1 place-wide">{{ .Title }}</h1>
  {{ with .Description }}
    <p class="type-display-1 default-single__description place-wide">{{ . }}</p>
  {{ end }}


  <div class="page-content prose">
    {{ .Content }}
  </div>
</div>

{{ partial "footer.html" . }}

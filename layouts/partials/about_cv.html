<div class="about-cv reveal">
  <div class="about-cv__icon curl-icon"></div>

  <h3 class="about-cv__title type-headline-3">
    {{ if eq site.Language.Lang "sv" }}
      Vad jag har gjort
    {{ else }}
      What I've been up to
    {{ end }}
  </h3>

  <div class="about-cv__columns">
    <div class="about-cv__timeline">
      {{ partial "about_cv_work.html" . }}

    <aside class="about-cv__aside">
      {{ partial "about_cv_aside.html" . }}
    </aside>
  </div>
</div>

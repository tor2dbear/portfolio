baseurl = "https://www.tor-bjorn.com/"
languageCode = "en-us"
title = "Torbjörn Hedberg · Multidisciplinary Designer"
author = "Torbjörn Hedberg"
canonifyurls = false
relativeURLs = false
preserveTaxonomyNames = true

[pagination]
  pagerSize = 10

[module]
  [[module.mounts]]
    source = "static"
    target = "static"

[taxonomies]
  tag = "tags"
  category = "categories"
  client = "clients"
  employer = "employers"
  topic = "topics"

[related]
  includeNewer = true
  threshold = 80
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "clients"
    weight = 100

  [[related.indices]]
    name = "employers"
    weight = 100

[minify]
  disableXML = true
  minifyOutput = true

DefaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    contentDir = "content/english"
    [languages.en.params]
      title = "Torbjörn Hedberg · Designer"
      description = "Designer based in Gothenburg. I lead product at Lokalguiden and write about design — how it works in practice, and how the work itself is changing."
    [[languages.en.menu.start]]
      name = "home"
      weight = 1
      identifier = "home"
      url = "/"
    [[languages.en.menu.all]]
      name = "all"
      weight = 2
      identifier = "works"
      url = "/works/"
    [[languages.en.menu.top]]
      name = "Works"
      weight = 2
      identifier = "works"
      url = "/works/"
    [[languages.en.menu.top]]
      name = "Writing"
      weight = 3
      identifier = "writing"
      url = "/writing/"
    [[languages.en.menu.top]]
      name = "About me"
      weight = 5
      identifier = "about"
      url = "/about"
    [[languages.en.menu.top]]
      name = "contact"
      weight = 6
      identifier = "contact"
      url = "/contact"

  [languages.sv]
    languageName = "Svenska"
    languageCode = "sv-SE"
    weight = 2
    contentDir = "content/swedish"
    [languages.sv.params]
      title = "Torbjörn Hedberg · Designer"
      description = "Designer baserad i Göteborg. Jag leder produktarbetet på Lokalguiden och skriver om design — hur det fungerar i praktiken och hur arbetet förändras."
    [[languages.sv.menu.start]]
      name = "hem"
      weight = 1
      identifier = "home"
      url = "/"
    [[languages.sv.menu.all]]
      name = "alla"
      weight = 2
      identifier = "works"
      url = "/arbeten/"
    [[languages.sv.menu.top]]
      name = "Arbeten"
      weight = 2
      identifier = "works"
      url = "/sv/arbeten/"
    [[languages.sv.menu.top]]
      name = "Texter"
      weight = 3
      identifier = "writing"
      url = "/sv/texter/"
    [[languages.sv.menu.top]]
      name = "Om mig"
      weight = 5
      identifier = "about"
      url = "/sv/om"
    [[languages.sv.menu.top]]
      name = "kontakt"
      weight = 6
      identifier = "contact"
      url = "/sv/kontakt"
    # Swedish smart quotes: both marks are the right double/single quote (”…”,
    # ’…’), so a quotation opens and closes with the same glyph — unlike the
    # English directional pair set at the root [markup...] above.
    [languages.sv.markup.goldmark.extensions.typographer]
      disable = false
      leftDoubleQuote = "&rdquo;"
      rightDoubleQuote = "&rdquo;"
      leftSingleQuote = "&rsquo;"
      rightSingleQuote = "&rsquo;"

[permalinks]
  works = '/:slug/:title/'
  writing = '/:slug/:title/'
  texter = '/:slug/:title/'
  newsletter = '/:slug/:title/'
  nyhetsbrev = '/:slug/:title/'
  tags = "/:slug/tags/:title/"

[params]
  # Shown in the home page
  subtitle = "Portfolio"
  brand = "tor-bjorn.com"
  newsletter_action = "/.netlify/functions/newsletter-subscribe"
  newsletter_email_field = "EMAIL"
  dateFormat = "02 Jan 2006, 15:04"
  mainSections = ['writing', 'texter', 'newsletter', 'works']
  # Cloudflare Web Analytics site token (cookieless, privacy-friendly).
  # Get it from the Cloudflare dashboard → Analytics & Logs → Web Analytics →
  # Add a site. The beacon loads only when the build's baseURL host matches
  # cloudflare_analytics_host below, so deploy previews (Netlify, GitHub Pages)
  # never emit it and pollute production stats. Leave the token empty to disable.
  cloudflare_analytics_token = "c6c51a6ea4c246019358361804383602"
  # Canonical production host the beacon is allowed to run on. Must match the
  # host of the baseURL used for the production build.
  cloudflare_analytics_host = "www.tor-bjorn.com"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      linkifyProtocol = 'https'
      strikethrough = true
      table = true
      taskList = true
      # Smart-quote substitutions. These are the English defaults ("..." with
      # directional marks); Swedish overrides the quote keys below so both marks
      # face the same way ("..."). See [languages.sv.markup...].
      [markup.goldmark.extensions.typographer]
        disable = false
        leftDoubleQuote = "&ldquo;"
        rightDoubleQuote = "&rdquo;"
        leftSingleQuote = "&lsquo;"
        rightSingleQuote = "&rsquo;"
    [markup.goldmark.parser]
      autoHeadingID = false
      autoHeadingIDType = 'github'
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = false
      xhtml = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = false

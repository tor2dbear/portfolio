<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Cadence logomark — a dot easing along a curve">
  <!-- the guide curve morphs; three dots ease along it toward a leading head -->
  <path fill="none" stroke="var(--lm-ink, currentColor)" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round" d="M8,23 C10.5,13.5 19,10 24,9">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;0.6667;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1" values="M8,23 C10.5,13.5 19,10 24,9;M8,23 C13.5,21.5 21.5,16 24,9;M8,23 C9.5,15.5 22.5,8 24,9;M8,23 C10.5,13.5 19,10 24,9"/>
  </path>
  <circle fill="var(--lm-ink, currentColor)" cx="8" cy="23" r="2.5"/>
  <circle fill="var(--lm-ink, currentColor)" cx="11.31" cy="16.35" r="2.5">
    <animate attributeName="cx" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;0.6667;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1" values="11.31;14.6;11.67;11.31"/>
    <animate attributeName="cy" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;0.6667;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1" values="16.35;19.9;16.66;16.35"/>
  </circle>
  <circle fill="var(--lm-ink, currentColor)" cx="17.01" cy="11.58" r="2.5">
    <animate attributeName="cx" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;0.6667;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1" values="17.01;20.17;17.32;17.01"/>
    <animate attributeName="cy" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3333;0.6667;1" keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1" values="11.58;15.18;11.88;11.58"/>
  </circle>
  <circle fill="var(--lm-head, var(--lm-ink, currentColor))" cx="24" cy="9" r="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" fill="none" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">
  <!-- column headers -->
  <g fill="currentColor" fill-opacity=".5" font-size="12" letter-spacing="1.5" text-anchor="middle">
    <text x="262" y="30">DURATION</text>
    <text x="492" y="30">EASING</text>
  </g>
  <g stroke="currentColor" stroke-opacity=".16">
    <line x1="196" y1="44" x2="328" y2="44"/>
    <line x1="384" y1="44" x2="600" y2="44"/>
  </g>

  <!-- rows: intent = duration + easing -->
  <g font-size="16">
    <!-- enter -->
    <g transform="translate(0,92)">
      <circle cx="24" cy="0" r="6" fill="var(--ig-enter)"/>
      <text x="42" y="5" fill="currentColor" font-weight="700">enter</text>
      <text x="168" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">=</text>
      <rect x="196" y="-19" width="132" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="262" y="5" fill="currentColor" text-anchor="middle">base</text>
      <text x="356" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">+</text>
      <rect x="384" y="-19" width="216" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="492" y="5" fill="currentColor" text-anchor="middle">emphasized</text>
    </g>
    <!-- exit -->
    <g transform="translate(0,152)">
      <circle cx="24" cy="0" r="6" fill="var(--ig-exit)"/>
      <text x="42" y="5" fill="currentColor" font-weight="700">exit</text>
      <text x="168" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">=</text>
      <rect x="196" y="-19" width="132" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="262" y="5" fill="currentColor" text-anchor="middle">fast</text>
      <text x="356" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">+</text>
      <rect x="384" y="-19" width="216" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="492" y="5" fill="currentColor" text-anchor="middle">accelerate</text>
    </g>
    <!-- move -->
    <g transform="translate(0,212)">
      <circle cx="24" cy="0" r="6" fill="var(--ig-move)"/>
      <text x="42" y="5" fill="currentColor" font-weight="700">move</text>
      <text x="168" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">=</text>
      <rect x="196" y="-19" width="132" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="262" y="5" fill="currentColor" text-anchor="middle">slow</text>
      <text x="356" y="5" fill="currentColor" fill-opacity=".45" text-anchor="middle">+</text>
      <rect x="384" y="-19" width="216" height="38" rx="9" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".28"/>
      <text x="492" y="5" fill="currentColor" text-anchor="middle">standard</text>
    </g>
  </g>
</svg>

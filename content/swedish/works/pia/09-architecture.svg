<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 454" role="img" aria-label="Arkitektur: Terminalen når lagring, auth och delning bara genom ett CommandContext och gränssnitten StorageAdapter, AuthAdapter och ShareStore — ett gränssnitt med två implementationer, en lokal (webbläsare, gäst) körning och en moln-körning (Supabase, inloggad) — så en stor ändring är ett byte, inte en omskrivning." preserveAspectRatio="xMidYMid meet"><title>Arkitektur: Terminalen når lagring, auth och delning bara genom ett CommandContext och gränssnitten StorageAdapter, AuthAdapter och ShareStore — ett gränssnitt med två implementationer, en lokal (webbläsare, gäst) körning och en moln-körning (Supabase, inloggad) — så en stor ändring är ett byte, inte en omskrivning.</title><style>@font-face{font-family:"JBM";src:url(data:font/woff2;base64,) format("woff2");}text{font-family:"JBM",monospace;font-size:15px;}</style><rect x="0" y="0" width="560" height="454" fill="#0b0f0a"/><rect x="20" y="24" width="520" height="46" rx="3" fill="none" stroke="#4d7d5e" stroke-width="1.3"/>

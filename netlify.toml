# Netlify configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "public"
  command = "hugo --minify --baseURL $URL"
  # Deploy Previews (PRs) build automatically and are non-metered (free).
  # Non-PR branch builds are skipped unless the commit message contains [netlify].
  # See scripts/netlify/ignore.sh for the full policy.
  ignore = "bash scripts/netlify/ignore.sh"

[build.environment]
  HUGO_VERSION = "0.154.2"
  NODE_VERSION = "20"

[context.production]
  environment = { HUGO_ENV = "production" }

[context.deploy-preview]
  command = "hugo --minify --buildFuture --buildDrafts --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --minify --buildFuture --buildDrafts --baseURL $DEPLOY_PRIME_URL"

# Redirects - English
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/#about"
  status = 301

# Redirects - Swedish
[[redirects]]
  from = "/sv/kontakt"
  to = "/sv/#contact"
  status = 301

[[redirects]]
  from = "/sv/kontakt/"
  to = "/sv/#contact"
  status = 301

[[redirects]]
  from = "/sv/om-mig"
  to = "/sv/#about"
  status = 301

[[redirects]]
  from = "/sv/om-mig/"
  to = "/sv/#about"
  status = 301

# 404 handling per language
[[redirects]]
  from = "/sv/*"
  to = "/sv/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY) so the site can frame its own pages same-origin —
    # e.g. the self-contained works hero animation (/cadence-hero.html) embedded
    # via the hero-embed shortcode. Cross-origin framing stays blocked, which is
    # the clickjacking protection that matters. frame-ancestors 'self' in the CSP
    # below is the modern equivalent; both are kept for older-browser coverage.
    X-Frame-Options = "SAMEORIGIN"
    # The legacy XSS auditor is deprecated and can itself introduce bugs in old
    # browsers; disable it and rely on the Content-Security-Policy instead.
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for a year (with preload eligibility). The site is HTTPS-only
    # on Netlify, so this has no downside and prevents SSL-strip downgrades.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Lock down powerful features the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    # Content-Security-Policy. Enumerated from an audit of every runtime origin:
    #   - script:  self + inline (many pre-hydration <head> scripts + the
    #              preload onload= handler) + the Cloudflare Web Analytics beacon.
    #   - style:   self + inline (@font-face block, critical hero CSS, the
    #              theme-no-trans style injected by the head script) + Adobe
    #              Typekit, used by the portfolio-print layout.
    #   - font:    self (self-hosted woff2) + Typekit (print layout).
    #   - img:     self + data: (inline SVG sprites / data-URI icons).
    #   - connect: self (Netlify functions, same-origin nav prefetch, contact +
    #              newsletter POST) + the Cloudflare beacon endpoint.
    #   - frame:   self (the hero-embed <iframe> is always same-origin).
    # No eval/new Function anywhere, so 'unsafe-eval' is intentionally omitted.
    # Kept on one line — Netlify header values do not support continuation.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://use.typekit.net; img-src 'self' data:; font-src 'self' https://use.typekit.net https://p.typekit.net; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hugo fingerprints all CSS/JS (content hash in the filename), so they can be
# cached forever — a content change produces a new URL. Every referenced .css
# and .js bundle is fingerprinted (the page-bundles, the main bundle, the
# lazy/standalone scripts, and the client/employer/print bundles).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

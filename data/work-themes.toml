# ── Cadence — the live tool's exact "Sand / Ink-navy" palette. ───────────────
#    Duo model, using Cadence's own tokens: beige base + deep navy accent.
#    surface-page (step 3) = Cadence --panel (its lighter warm), so the page is a
#    touch lighter than the site's --bg; surface-default (step 4, the fact box) =
#    Cadence --bg exactly, so the fact box reads at the tool's own paper tone and
#    the case-study images keep an edge. accent step 9 = Cadence --accent (the
#    "Start designing" button); on-primary = Cadence --on-accent.
[[themes]]
id = "cadence"
name = "Cadence"
role_mode = "surface"
anchor_step = 3
on_primary_step_light = 1
on_primary_step_dark = 1
accent_step_light = 9
accent_step_dark = 10

# Beige — Cadence Sand. step3 = --panel (page), step4 = --bg (fact box),
# step5 = --line, step12 = --ink.

# ── Cadence — matches the live tool: a light beige page, deep navy accents. ──
#    Duo model. The base (beige) scale paints the surface + text; the accent
#    (navy/indigo) scale drives primary/links/tags/buttons — the same deep navy
#    as the tool's "Start designing" button. surface-page (step 3) is kept a
#    touch lighter than the real site so images keep an edge; surface-default
#    (step 4, the project-info "fact box") is set to the real site's own beige
#    background, so the fact box reads at the tool's actual paper tone.
[[themes]]
id = "cadence"
name = "Cadence"
role_mode = "surface"
anchor_step = 3
on_primary_step_light = 1
on_primary_step_dark = 1
accent_step_light = 9
accent_step_dark = 10

# Beige — the paper. step 3 = page (lighter than the site); step 4 = fact box

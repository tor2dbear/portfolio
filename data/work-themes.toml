# ============================================================================
# Work project color themes
#
# Per-project color identities, applied to an individual works/ page via its
# front matter: `theme: "<id>"`. Each theme ships an explicit light AND dark
# scale (12 Radix-style steps) so it works in both color modes with no FOUC —
# the theme is a static CSS dimension keyed on data-work-theme, generated by
# assets/templates/work-theme-scales.css and set server-side in header.html.
#
# Precedence: a work theme is a BASE layer. An explicitly chosen Pantone
# palette overrides it (the generated selectors carry :not([data-palette="pantone"])),
# and a user-authored custom palette — applied as inline styles — wins too.
# On the default (standard) palette the work theme paints the page.
#
# Fields per theme (mirrors data/pantone-coty.toml):
#   id                     kebab-case identifier used in front matter
#   name                   human-readable label
#   role_mode              "surface" (tinted page) | "primary" (accent-led)
#   anchor_step            surface mode: page surface step; primary mode: primary step
#   source_step_dark       primary mode: which step drives --primary in dark
#   on_primary_step_light  step used for text on primary buttons (light)
#   on_primary_step_dark   step used for text on primary buttons (dark)
#   scale_light / scale_dark   the 12 color steps per mode
#   overrides_light / overrides_dark   optional per-mode semantic token remaps
#
# Every theme is contrast-gated in both modes by
# assets/css/__tests__/work-theme-contrast.test.js — keep new themes green.
# ============================================================================

[meta]
name = "work-themes"

# ── Azure — a calm blue, surface-led (the page itself takes a soft tint) ─────
[[themes]]
id = "azure"
name = "Azure"
role_mode = "surface"
anchor_step = 2
source_step_dark = 10
on_primary_step_light = 1
on_primary_step_dark = 1

[themes.scale_dark]
"1" = "#00040C"
"2" = "#000613"
"3" = "#020E1D"
"4" = "#0C1C2C"
"5" = "#1E2E40"
"6" = "#334457"
"7" = "#4C5E72"
"8" = "#687B90"
"9" = "#879AB0"
"10" = "#98B4D4"
"11" = "#D4D8DC"
"12" = "#F2F5FA"

[themes.scale_light]
"1" = "oklch(98% 0.003 251.97)"
"2" = "oklch(96% 0.006 251.97)"
"3" = "oklch(92% 0.015 251.97)"
"4" = "oklch(84.95% 0.031 251.97)"
"5" = "oklch(81% 0.042 251.97)"
"6" = "oklch(75.99% 0.0555 251.97)"
"7" = "oklch(64% 0.087 251.97)"
"8" = "oklch(54.33% 0.085 251.97)"
"9" = "oklch(44% 0.069 251.97)"
"10" = "oklch(32% 0.05 251.97)"
"11" = "oklch(21% 0.032 251.97)"
"12" = "oklch(10% 0.013 251.97)"

# ── Rose — a warm magenta, primary-led (accent drives the identity) ──────────
[[themes]]
id = "rose"
name = "Rose"
role_mode = "primary"
anchor_step = 8
source_step_dark = 8
on_primary_step_light = 1

# ── Utblick — a two-spot-colour print identity: rose paper + green ink. ───────
#    Duo model: the base (rose) scale paints the surface + text, the accent
#    (green) scale drives every accent role — primary, links, tags, buttons.
[[themes]]
id = "utblick"
name = "Utblick"
role_mode = "surface"
anchor_step = 3
on_primary_step_light = 1
on_primary_step_dark = 1
accent_step_light = 9

# Static tritone stops per work theme (shadow / mid / highlight → sRGB
# 0-1 tableValues). Consumed by partials/work-theme-tritone.html to build
# the SVG filter. Hex shown in comments; values are precomputed so Hugo
# needs no hex parsing.


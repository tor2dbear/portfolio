# --- Terminal command engine (rendered into data-js="terminal-i18n" by
# footer.html and read by terminal.js). Keep the command column alignment in
# terminal_help / terminal_easter_eggs; only the descriptions are prose. ---

[terminal_help]
other = """
commands:
  help      this list
  whoami    who's asking
  date      date & time
  pwd       working dir
  ls        list dir
  cd <page> change page
  cv        résumé (about)
  tree      site map
  lang [sv|en]  language
  echo      print text
  neofetch  session info
  dark|light|system  mode
  pantone   [on|off|YYYY]
  grain|blend|motion on/off
  grid      layout grid
  set [k v] view/set settings
  share     copy this look
  layout <name>  switch layout
  hire      let's work together
  social    my links
  copy <x>  to clipboard
  ai        chat with clanker
  contact   message me
  subscribe newsletter
  clear     wipe the screen
  exit      leave the terminal
keys: ↑↓ history · Tab complete · ^L/^C/^U
"""

